name: REDHUB UI smoke tests and visual capture

on:
  push:
    branches:
      - fix/v16-1-mobile-visual-audit
      - fix/v16-2-mobile-vertical-navigation
      - fix/v16-3-mobile-responsive
      - fix/v16-4-pengurus-hero-logo
      - feat/v16-5-unified-mobile-qr
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed REDHUB URL to test"
        required: true
        default: "https://redhub-render-latihan.onrender.com"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Browser smoke tests and visual capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start branch preview server
        if: github.event_name == 'push'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/redhub-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Test deployed UI
        env:
          BASE_URL: ${{ github.event_name == 'push' && 'http://127.0.0.1:8765' || inputs.base_url }}
        run: node tests/ui-smoke.mjs

      - name: Capture desktop and mobile screenshots
        if: always()
        env:
          BASE_URL: ${{ github.event_name == 'push' && 'http://127.0.0.1:8765' || inputs.base_url }}
        run: node tests/ui-screenshots.mjs

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redhub-ui-visual-audit
          path: artifacts/ui-audit/
          if-no-files-found: warn
          retention-days: 7
