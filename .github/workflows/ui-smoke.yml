name: REDHUB UI smoke tests and visual capture

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed REDHUB URL to test"
        required: true
        default: "https://redhub-render-latihan.onrender.com"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Browser smoke tests and visual capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test deployed UI
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node tests/ui-smoke.mjs

      - name: Capture desktop and mobile screenshots
        if: always()
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node tests/ui-screenshots.mjs

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redhub-ui-visual-audit
          path: artifacts/ui-audit/
          if-no-files-found: warn
          retention-days: 7
